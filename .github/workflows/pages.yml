name: Publish game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out game files
        uses: actions/checkout@v4
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Prepare static game files
        run: |
          mkdir public
          cp index.html public/
          cp -R assets public/
      - name: Upload game
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish Pages site
        id: deployment
        uses: actions/deploy-pages@v4
