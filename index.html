<section id="startScreen" class="start-screen" aria-label="Choose your fighter">

      <select id="onlineFighter" aria-label="Choose your online fighter"><option value="gabriel">Play as Gabriel</option><option value="hamsa">Play as Hamsa</option></select>
      <input id="onlineWorkerUrl" type="url" inputmode="url" placeholder="https://your-worker.workers.dev" aria-label="Cloudflare Worker URL">
      <button id="createRoom" type="button">Create room</button><input id="roomCode" maxlength="8" autocomplete="off" autocapitalize="characters" placeholder="ROOM CODE" aria-label="Room code"><button id="joinRoom" type="button">Join room</button>
      <button id="cancelOnline" class="wide hidden" type="button">Cancel connection</button>

    </div>
  </div>
</section>
<main id="gameMain" class="hidden">

</main><script>

  hamsa:{el:h,idle:'assets/hamsa-master.png',jab:'assets/hamsa-jab.png',kick:'assets/hamsa-kick.png',blockPrep:'assets/hamsa-block-prep.png',block:'assets/hamsa-block.png',walkForward:'assets/hamsa-walk-forward.png',walkBackward:'assets/hamsa-walk-backward.png',pain:'assets/hamsa-pain-reaction.png',recoil:'assets/hamsa-hit-recoil.png'}
};
let gabrielHealth=100, hamsaHealth=100, combo=0, busy=false, timer, recoveryTimer, activeFighter='gabriel';
let gabrielInset=window.matchMedia('(max-width:420px)').matches?2:3, hamsaInset=3;
const movementStates={gabriel:{interval:null,direction:null,source:null},hamsa:{interval:null,direction:null,source:null}};
let onlineMode=null;
const arenaElement=document.querySelector('.arena');
function applyFighterPositions(){g.style.left=gabrielInset+'%';h.style.right=hamsaInset+'%'}
function resetFighterPositions(){gabrielInset=window.matchMedia('(max-width:420px)').matches?2:3;hamsaInset=3;applyFighterPositions()}
function sendOnline(message){if(onlineMode?.ready&&onlineMode.socket?.readyState===WebSocket.OPEN)onlineMode.socket.send(JSON.stringify(message))}
function stopMovement(source,fighterName=activeFighter){
  const state=movementStates[fighterName];if(source&&state.source!==source)return;
  const wasMoving=Boolean(state.direction),localInput=state.source==='keyboard'||state.source==='touch';
  if(state.interval!==null){clearInterval(state.interval);state.interval=null}state.direction=null;state.source=null;
  if(wasMoving&&localInput&&fighterName===activeFighter)sendOnline({type:'moveStop'});
  if(!busy)fighters[fighterName].el.src=fighters[fighterName].idle;
}
function stopAllMovement(){stopMovement(undefined,'gabriel');stopMovement(undefined,'hamsa')}
function nudgeFighter(direction,amount,fighterName=activeFighter){
  if(busy||document.getElementById('gameMain').classList.contains('hidden'))return;
  if(fighterName==='gabriel'){
    gabrielInset=direction==='forward'?Math.min(38,gabrielInset+amount):Math.max(-8,gabrielInset-amount);
  }else{
    hamsaInset=direction==='forward'?Math.min(38,hamsaInset+amount):Math.max(-8,hamsaInset-amount);
  }
  applyFighterPositions();
}
function startMovement(direction,source,fighterName=activeFighter){
  if(busy||document.getElementById('gameMain').classList.contains('hidden'))return;
  const state=movementStates[fighterName];if(state.direction===direction&&state.source===source)return;
  stopMovement(undefined,fighterName);
  state.direction=direction;state.source=source;fighters[fighterName].el.src=fighters[fighterName][direction==='forward'?'walkForward':'walkBackward'];
  if(fighterName===activeFighter&&source!=='remote')sendOnline({type:'moveStart',direction});
  nudgeFighter(direction,0.9,fighterName);
  state.interval=setInterval(()=>{if(busy||!state.direction){stopMovement(undefined,fighterName);return}nudgeFighter(state.direction,0.62,fighterName)},35);
}

const moves={jab:{damage:5,label:'JAB!',word:'POW!'},kick:{damage:10,label:'KICK!',word:'WHAM!'}};
function showImpact(word){impact.textContent=word;impact.classList.remove('show');void impact.offsetWidth;impact.classList.add('show')}
function setFighter(name,force=false){if(busy||(onlineMode?.ready&&!force))return;stopMovement();activeFighter=name;g.style.zIndex=name==='gabriel'?'4':'2';h.style.zIndex=name==='hamsa'?'4':'2';msg.textContent=(name==='gabriel'?'Gabriel':'Hamsa')+' selected. Use J for jab, K for kick, and L to block.'}
function attack(type,fromNetwork=false,remoteHit=null){
  if(busy)return;
  stopMovement();
  const player=fighters[activeFighter], enemy=fighters[activeFighter==='gabriel'?'hamsa':'gabriel'];
  const enemyIsGabriel=activeFighter==='hamsa';
  if(type==='block'){
    if(!fromNetwork)sendOnline({type:'attack',move:type});
    busy=true;player.el.src=player.blockPrep;
    msg.textContent=(activeFighter==='gabriel'?'GABRIEL':'HAMSA')+' BLOCKS!';showImpact('BLOCK!');
    timer=setTimeout(()=>{player.el.src=player.block;timer=setTimeout(()=>{player.el.src=player.idle;busy=false},330)},90);return;
  }
  const playerBounds=player.el.getBoundingClientRect(), enemyBounds=enemy.el.getBoundingClientRect();
  const centerDistance=Math.abs((playerBounds.left+playerBounds.width/2)-(enemyBounds.left+enemyBounds.width/2));
  const hit=remoteHit===null?centerDistance<=arenaElement.clientWidth*0.18:remoteHit;
  if(!fromNetwork)sendOnline({type:'attack',move:type,hit});
  if(!hit){msg.textContent='OUT OF RANGE — MOVE CLOSER TO LAND THE HIT.';showImpact('MISS!');return}
  const enemyHealth=enemyIsGabriel?gabrielHealth:hamsaHealth;
  if(enemyHealth<=0)return;
  busy=true;const m=moves[type];
  if(enemyIsGabriel){gabrielHealth=Math.max(0,gabrielHealth-m.damage);playerFill.style.width=gabrielHealth+'%'}
  else{hamsaHealth=Math.max(0,hamsaHealth-m.damage);enemyFill.style.width=hamsaHealth+'%'}
  combo++;comboEl.textContent=combo;
  const remaining=enemyIsGabriel?gabrielHealth:hamsaHealth;
  msg.textContent=remaining===0?'K.O.! '+(activeFighter==='gabriel'?'Gabriel':'Hamsa')+' wins!':(activeFighter==='gabriel'?'GABRIEL':'HAMSA')+' '+m.label+' — '+m.damage+' damage.';
  showImpact(remaining===0?'K.O.!':m.word);
  player.el.src=player[type];enemy.el.src=enemy.recoil;
  player.el.classList.remove('attack','kicking','hamsa-jab','hamsa-kick');enemy.el.classList.remove('recoil');
  void player.el.offsetWidth;void enemy.el.offsetWidth;
  player.el.classList.add(activeFighter==='gabriel'?(type==='kick'?'kicking':'attack'):(type==='kick'?'hamsa-kick':'hamsa-jab'));
  enemy.el.classList.add('recoil');
  timer=setTimeout(()=>{enemy.el.src=enemy.pain},150);
  recoveryTimer=setTimeout(()=>{player.el.src=player.idle;enemy.el.src=enemy.idle;player.el.classList.remove('attack','kicking','hamsa-jab','hamsa-kick');enemy.el.classList.remove('recoil');busy=false},type==='kick'?680:510);
}
function resetFight(){
  clearTimeout(timer);clearTimeout(recoveryTimer);stopAllMovement();resetFighterPositions();busy=false;
  gabrielHealth=100;hamsaHealth=100;combo=0;playerFill.style.width='100%';enemyFill.style.width='100%';comboEl.textContent='0';
  g.src=fighters.gabriel.idle;g.style.visibility='visible';g.classList.remove('attack','kicking','recoil');
  h.src=fighters.hamsa.idle;h.classList.remove('recoil','hamsa-jab','hamsa-kick','hamsa-blocking');impact.classList.remove('show');
  msg.textContent='Fight reset. J jab · K kick · L block.';
}
function returnToSelect(){
  if(busy)return;
  if(onlineMode?.socket?.readyState===WebSocket.OPEN)onlineMode.socket.close();onlineMode=null;document.getElementById('cancelOnline').classList.add('hidden');
  resetFight();document.getElementById('gameMain').classList.add('hidden');document.getElementById('startScreen').classList.remove('hidden');
}
function movementDirectionForKey(key){
  const towardOpponent=key==='d'||key==='arrowright';
  if(activeFighter==='gabriel')return towardOpponent?'forward':'backward';
  return towardOpponent?'backward':'forward';
}
function movementDirectionForScreen(side){
  const movesRight=side==='right';
  const towardOpponent=(activeFighter==='gabriel')===movesRight;
  return towardOpponent?'forward':'backward';
}
document.querySelectorAll('[data-touch-side]').forEach(button=>{
  const begin=event=>{event.preventDefault();button.classList.add('is-pressed');try{button.setPointerCapture(event.pointerId)}catch{}startMovement(movementDirectionForScreen(button.dataset.touchSide),'touch')};
  const end=event=>{event.preventDefault();button.classList.remove('is-pressed');stopMovement('touch')};
  button.addEventListener('pointerdown',begin);button.addEventListener('pointerup',end);button.addEventListener('pointercancel',end);button.addEventListener('lostpointercapture',end);
});
document.querySelectorAll('[data-touch-attack]').forEach(button=>button.addEventListener('click',()=>attack(button.dataset.touchAttack)));
const onlineStatus=document.getElementById('onlineStatus'), onlineWorkerUrl=document.getElementById('onlineWorkerUrl'), roomCodeInput=document.getElementById('roomCode'), cancelOnline=document.getElementById('cancelOnline');
try{onlineWorkerUrl.value=localStorage.getItem('gabriel-vs-hamsa-worker')||''}catch{}
function setOnlineStatus(message,isError=false){onlineStatus.textContent=message;onlineStatus.classList.toggle('error',isError)}
function startOnlineConnection(createRoom){
  if(onlineMode?.socket?.readyState===WebSocket.OPEN){setOnlineStatus('You are already connected to a room.',true);return}
  const workerText=onlineWorkerUrl.value.trim().replace(/\/$/,'');
  let worker;
  try{worker=new URL(workerText);if(!['http:','https:'].includes(worker.protocol))throw new Error()}catch{setOnlineStatus('Paste the Worker address from your Cloudflare deployment first.',true);return}
  try{localStorage.setItem('gabriel-vs-hamsa-worker',workerText)}catch{}
  let code=roomCodeInput.value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(createRoom){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',bytes=crypto.getRandomValues(new Uint8Array(6));code=Array.from(bytes,value=>chars[value%chars.length]).join('');roomCodeInput.value=code}
  if(code.length<4){setOnlineStatus('Enter the room code from the other player.',true);return}
  worker.protocol=worker.protocol==='https:'?'wss:':'ws:';worker.pathname='/room/'+encodeURIComponent(code);worker.search='';worker.hash='';
  setOnlineStatus(createRoom?'Creating room '+code+'…':'Joining room '+code+'…');
  const socket=new WebSocket(worker.toString());onlineMode={socket,room:code,ready:false,you:null,opponent:null};cancelOnline.classList.remove('hidden');
  socket.addEventListener('open',()=>socket.send(JSON.stringify({type:'join',fighter:document.getElementById('onlineFighter').value})));
  socket.addEventListener('message',event=>{
    let message;try{message=JSON.parse(event.data)}catch{return}
    if(message.type==='error'){setOnlineStatus(message.message,true);onlineMode.ready=false;socket.close();return}
    if(message.type==='waiting'){setOnlineStatus('Room '+code+' is ready. Share the code with your opponent.');return}
    if(message.type==='ready'){
      onlineMode.ready=true;onlineMode.you=message.you;onlineMode.opponent=message.opponent;
      cancelOnline.classList.add('hidden');
      setOnlineStatus('Connected to room '+code+' · You are '+message.you+'.');
      startGame(message.you);return;
    }
    if(message.type==='peer-left'){onlineMode.ready=false;stopAllMovement();msg.textContent='Opponent disconnected. Return to fighter select to start another room.';setOnlineStatus('Your opponent disconnected. Create or join a room to play again.',true);onlineMode=null;cancelOnline.classList.add('hidden');socket.close();return}
    if(!onlineMode.ready||message.from!==onlineMode.opponent)return;
    if(message.type==='moveStart'){startMovement(message.direction,'remote',message.from);return}
    if(message.type==='moveStop'){stopMovement('remote',message.from);return}
    if(message.type==='attack'){
      const previous=activeFighter;activeFighter=message.from;
      try{attack(message.move,true,typeof message.hit==='boolean'?message.hit:null)}finally{activeFighter=previous}
    }
  });
  socket.addEventListener('error',()=>setOnlineStatus('Could not connect. Check the Worker URL and try again.',true));
  socket.addEventListener('close',event=>{if(onlineMode?.socket!==socket)return;if(event.code!==1000&&!onlineMode?.ready)setOnlineStatus(event.reason||'Connection closed. Check the room code and Worker URL.',true);onlineMode=null;cancelOnline.classList.add('hidden')});
}
document.getElementById('createRoom').addEventListener('click',()=>startOnlineConnection(true));
document.getElementById('joinRoom').addEventListener('click',()=>startOnlineConnection(false));
cancelOnline.addEventListener('click',()=>{if(onlineMode?.socket?.readyState===WebSocket.OPEN)onlineMode.socket.close();onlineMode=null;cancelOnline.classList.add('hidden');setOnlineStatus('Connection cancelled.')});
document.addEventListener('keydown',event=>{
  const key=event.key.toLowerCase();
  if(event.target&&(/INPUT|TEXTAREA|SELECT/.test(event.target.tagName)||event.target.isContentEditable))return;
  const inGame=!document.getElementById('gameMain').classList.contains('hidden');
  if(inGame&&key==='r'&&!onlineMode?.ready){event.preventDefault();resetFight();return}
  if(inGame&&key==='escape'){event.preventDefault();returnToSelect();return}
  if(inGame&&(key==='1'||key==='2')&&!onlineMode?.ready){event.preventDefault();if(!event.repeat)setFighter(key==='1'?'gabriel':'hamsa');return}
  const attackKey={j:'jab',k:'kick',l:'block'}[key];
  if(attackKey){event.preventDefault();if(!event.repeat)attack(attackKey);return}
  if(!['a','d','arrowleft','arrowright'].includes(key))return;
  event.preventDefault();
  if(event.repeat&&movementStates[activeFighter].source==='keyboard')return;
  startMovement(movementDirectionForKey(key),'keyboard');
});
document.addEventListener('keyup',event=>{
  const key=event.key.toLowerCase();
  if(['a','d','arrowleft','arrowright'].includes(key)&&movementStates[activeFighter].direction===movementDirectionForKey(key))stopMovement('keyboard');
});
window.addEventListener('blur',()=>stopAllMovement());
function startGame(name){setFighter(name,Boolean(onlineMode?.ready));document.getElementById('startScreen').classList.add('hidden');document.getElementById('gameMain').classList.remove('hidden');msg.textContent=(name==='gabriel'?'Gabriel':'Hamsa')+' selected. Use J for jab, K for kick, and L to block.'}
document.querySelectorAll('[data-start-fighter]').forEach(b=>b.addEventListener('click',()=>{if(onlineMode?.socket?.readyState===WebSocket.OPEN){setOnlineStatus('Finish or close your online connection before starting a local match.',true);return}onlineMode=null;startGame(b.dataset.startFighter)}));
document.addEventListener('keydown',event=>{if(document.getElementById('startScreen').classList.contains('hidden')||onlineMode)return;if(event.target&&(/INPUT|TEXTAREA|SELECT/.test(event.target.tagName)||event.target.isContentEditable))return;if(event.key==='1'||event.key==='2'){event.preventDefault();if(!event.repeat)startGame(event.key==='1'?'gabriel':'hamsa')}});

</script></body></html>
